<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ page_title }} — Admin Admission{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .status-badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }
  </style>
</head>
<body class="h-full">
<div class="min-h-full">

  <!-- Sidebar -->
  <div class="fixed inset-y-0 left-0 w-64 bg-gray-900 flex flex-col">
    <!-- Logo -->
    <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-700">
      <div class="w-8 h-8 bg-green-500 rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <div>
        <p class="text-white font-semibold text-sm">Admission</p>
        <p class="text-gray-400 text-xs">Interface Admin</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
      <a href="/admin/"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium
                {% if request.url.path == '/admin/' %}bg-gray-700 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Tableau de bord
      </a>

      <a href="/admin/applications"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium
                {% if '/admin/applications' in request.url.path %}bg-gray-700 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Candidatures
      </a>

      <a href="/admin/universities"
         class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium
                {% if '/admin/universities' in request.url.path %}bg-gray-700 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
        Universités
      </a>

      <div class="pt-4 mt-4 border-t border-gray-700">
        <a href="/docs" target="_blank"
           class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
          </svg>
          API Docs
        </a>
      </div>
    </nav>

    <!-- User info -->
    <div class="px-4 py-4 border-t border-gray-700">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 bg-green-500 rounded-full flex items-center justify-center">
            <span class="text-white text-xs font-bold">{{ admin_user[0].upper() }}</span>
          </div>
          <span class="text-gray-300 text-sm">{{ admin_user }}</span>
        </div>
        <a href="/admin/logout" class="text-gray-400 hover:text-white text-xs">Déco.</a>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <div class="pl-64">
    <!-- Top bar -->
    <div class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
      <h1 class="text-xl font-semibold text-gray-900">{{ page_title }}</h1>
      <span class="text-sm text-gray-500">{{ now().strftime('%d/%m/%Y %H:%M') if now else '' }}</span>
    </div>

    <!-- Page content -->
    <main class="p-8">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
