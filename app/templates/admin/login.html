<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — Admin Admission</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center">
<div class="w-full max-w-sm">
  <!-- Logo -->
  <div class="flex flex-col items-center mb-8">
    <div class="w-14 h-14 bg-green-500 rounded-2xl flex items-center justify-center shadow-lg mb-4">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900">Interface Admin</h1>
    <p class="text-sm text-gray-500 mt-1">Gestion des admissions universitaires</p>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
    {% if error %}
    <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg flex items-center gap-2">
      <svg class="w-4 h-4 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <p class="text-sm text-red-700">{{ error }}</p>
    </div>
    {% endif %}

    <form method="post" action="/admin/login" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Identifiant</label>
        <input type="text" name="username" required autofocus
               class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm
                      focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent
                      placeholder-gray-400"
               placeholder="admin" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe</label>
        <input type="password" name="password" required
               class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm
                      focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent" />
      </div>
      <button type="submit"
              class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold
                     py-2.5 px-4 rounded-lg text-sm transition-colors">
        Se connecter
      </button>
    </form>
  </div>

  <p class="text-center text-xs text-gray-400 mt-6">
    Credentials définis dans les variables d'environnement
    <code class="bg-gray-100 px-1 py-0.5 rounded">ADMIN_USERNAME</code> /
    <code class="bg-gray-100 px-1 py-0.5 rounded">ADMIN_PASSWORD</code>
  </p>
</div>
</body>
</html>
