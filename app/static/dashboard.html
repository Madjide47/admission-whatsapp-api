<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tableau de bord — Admissions</title>
<style>
  :root {
    --bg:#0a0805; --bg2:#0f0b06; --panel:#15110a; --panel2:#1f1810; --line:#3a2f17; --line2:#2a2214;
    --txt:#f3ead2; --muted:#b39a64; --faint:#7a6a45;
    --accent:#d4af37; --accent2:#b8901f; --gold:#e8c659;
    --green:#3fae6b; --red:#e0564e; --amber:#e0a93f;
    --shadow:0 8px 30px #00000066;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--txt);
    background:radial-gradient(1200px 600px at 80% -10%, #1a140a 0%, transparent 60%), var(--bg); }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#3a2f17; border-radius:10px; }
  ::-webkit-scrollbar-track { background:transparent; }

  /* ---------- Header ---------- */
  header { position:sticky; top:0; z-index:20; background:linear-gradient(180deg,#000 0%,#0d0904 100%);
    border-bottom:1px solid var(--accent); padding:11px 22px; display:flex; align-items:center; gap:16px;
    flex-wrap:wrap; box-shadow:0 2px 20px #d4af3722; }
  .app-title { font-size:16px; font-weight:800; letter-spacing:.18em; text-transform:uppercase;
    background:linear-gradient(180deg,#f7e08a,#d4af37 55%,#a9801c); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent; }
  .tabs { display:flex; gap:4px; }
  .tab { padding:8px 16px; border-radius:10px; cursor:pointer; color:var(--muted); font-size:14px; font-weight:600;
    display:flex; align-items:center; gap:7px; transition:.15s; }
  .tab:hover { color:var(--txt); background:#ffffff08; }
  .tab.active { background:var(--panel2); color:var(--gold); box-shadow:inset 0 0 0 1px #d4af3744; }
  .creds { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input, button, select { font-family:inherit; font-size:13px; }
  input, select { background:var(--panel2); border:1px solid var(--line); color:var(--txt); padding:8px 11px; border-radius:9px; }
  input::placeholder { color:var(--faint); }
  input:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px #d4af3722; }
  header input { width:188px; }
  select option { background:#15110a; }
  button { background:linear-gradient(180deg,var(--gold),var(--accent2)); color:#1a1206; border:0; padding:9px 15px;
    border-radius:9px; cursor:pointer; font-weight:700; transition:.15s; }
  button:hover { filter:brightness(1.08); transform:translateY(-1px); }
  button:active { transform:translateY(0); }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--gold); }
  button.ghost:hover { border-color:var(--accent); background:#d4af3711; }
  button.green { background:linear-gradient(180deg,#54c483,#2f8f56); color:#04140a; }
  button.red { background:linear-gradient(180deg,#ec6a62,#c43d35); color:#1a0606; }
  button.sm { padding:6px 11px; font-size:12px; border-radius:8px; }
  button.icon { padding:7px 10px; }

  main { padding:24px 22px 60px; max-width:1140px; margin:0 auto; }
  .view { display:none; animation:fade .25s ease; } .view.active { display:block; }
  @keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* ---------- Stat chips ---------- */
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .chip { position:relative; background:linear-gradient(180deg,#16110a,#120e07); border:1px solid var(--line2);
    border-radius:14px; padding:13px 18px; cursor:pointer; min-width:108px; transition:.15s; overflow:hidden; }
  .chip:hover { border-color:var(--accent); transform:translateY(-2px); }
  .chip.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 6px 20px #d4af3722; }
  .chip.active::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background:linear-gradient(90deg,var(--gold),var(--accent2)); }
  .chip .n { font-size:26px; font-weight:800; line-height:1; }
  .chip .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:6px; }
  .chip.s-all .n{color:var(--gold);} .chip.s-progress .n{color:#e8c659;}
  .chip.s-validated .n{color:#7bd49b;} .chip.s-accepted .n{color:#5fd185;} .chip.s-rejected .n{color:#e58a84;}

  .bar { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .bar .grow { flex:1; }
  .search-wrap { position:relative; flex:1; max-width:360px; }
  .search-wrap input { width:100%; padding-left:34px; }
  .search-wrap .ico { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:14px; }
  .count { color:var(--muted); font-size:13px; white-space:nowrap; }

  /* ---------- Table ---------- */
  .card { background:linear-gradient(180deg,#14100a,#100c07); border:1px solid var(--line2); border-radius:16px;
    overflow:hidden; box-shadow:var(--shadow); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:13px 16px; border-bottom:1px solid var(--line2); font-size:14px; }
  th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    background:#0d0904; position:sticky; top:0; }
  tbody tr { transition:background .12s; }
  tbody tr.click { cursor:pointer; }
  tbody tr.click:hover { background:#ffffff07; }
  tbody tr:last-child td { border-bottom:0; }
  .who { display:flex; align-items:center; gap:11px; }
  .avatar { width:34px; height:34px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:#1a1206; background:linear-gradient(135deg,#f1d98a,#c79a23); box-shadow:0 0 0 1px #d4af3733; }
  .who .nm { font-weight:650; }
  .scorebar { display:flex; align-items:center; gap:9px; min-width:96px; }
  .scorebar .track { flex:1; height:6px; border-radius:6px; background:#2a2214; overflow:hidden; }
  .scorebar .fill { height:100%; border-radius:6px; background:linear-gradient(90deg,#c79a23,#7bd49b); }
  .scorebar .pct { font-size:12.5px; color:var(--muted); width:34px; text-align:right; }

  /* ---------- Badges ---------- */
  .badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:650; white-space:nowrap; }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.9; }
  .badge.nodot::before { display:none; }
  .b-collect { background:#3a2f1733; color:#e8c659; } .b-valid { background:#14532d33; color:#86efac; }
  .b-pending { background:#78350f33; color:#fcd34d; } .b-accept { background:#14532d4d; color:#5fd185; }
  .b-reject { background:#7f1d1d44; color:#e58a84; } .b-sent { background:#4a3f1f44; color:#e8c659; }
  .b-pub { background:#14532d33; color:#86efac; } .b-draft { background:#2a221888; color:#b39a64; }

  .muted { color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:54px 20px; }
  .empty .big { font-size:34px; margin-bottom:10px; opacity:.5; }

  /* ---------- Modal ---------- */
  .overlay { position:fixed; inset:0; background:#000a; backdrop-filter:blur(4px); display:none;
    align-items:flex-start; justify-content:center; padding:42px 16px; overflow:auto; z-index:50; }
  .overlay.show { display:flex; animation:fade .2s ease; }
  .modal { background:linear-gradient(180deg,#16110a,#100c07); border:1px solid var(--line); border-radius:18px;
    width:100%; max-width:760px; box-shadow:var(--shadow); animation:pop .22s ease; }
  .modal.wide { max-width:980px; }
  @keyframes pop { from{opacity:0; transform:scale(.97) translateY(8px);} to{opacity:1; transform:none;} }
  .modal-head { padding:18px 22px; border-bottom:1px solid var(--line2); display:flex; align-items:center; gap:12px; }
  .modal-head h2 { margin:0; font-size:18px; font-weight:700; }
  .modal-head .x { margin-left:auto; cursor:pointer; color:var(--muted); font-size:24px; line-height:1; width:30px; height:30px;
    display:flex; align-items:center; justify-content:center; border-radius:8px; transition:.12s; }
  .modal-head .x:hover { background:#ffffff10; color:var(--txt); }
  .modal-body { padding:22px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 24px; margin-bottom:18px; }
  .grid .k { color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; }
  .grid .v { font-size:14.5px; margin-top:3px; }
  .doc { background:var(--panel2); border:1px solid var(--line2); border-radius:11px; padding:12px 14px; margin-bottom:10px; }
  .doc .top { display:flex; align-items:center; gap:8px; } .doc .errs { color:#e58a84; font-size:12.5px; margin-top:7px; line-height:1.5; }
  .section-title { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 0 12px;
    display:flex; align-items:center; gap:10px; font-weight:700; }
  .section-title .grow { flex:1; }
  .section-title .ct { background:#2a2214; color:var(--gold); border-radius:999px; padding:2px 9px; font-size:11px; letter-spacing:0; }
  .actions { display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; align-items:center; }
  .ai-notes { background:var(--panel2); border-left:3px solid var(--accent); padding:11px 14px; border-radius:8px; font-size:13.5px; white-space:pre-wrap; line-height:1.5; }
  .err-box, .ok-box { padding:11px 15px; border-radius:11px; margin-bottom:14px; font-size:13px; display:none; }
  .err-box { background:#7f1d1d33; border:1px solid #b91c1c66; color:#fca5a5; }
  .ok-box { background:#14532d33; border:1px solid #15803d66; color:#bbf7d0; }

  /* ---------- Form editor ---------- */
  .form-layout { display:grid; grid-template-columns:1fr 318px; gap:22px; }
  @media (max-width:820px){ .form-layout { grid-template-columns:1fr; } }
  .hint { color:var(--faint); font-size:12.5px; margin:-4px 0 12px; }
  .fcard { background:var(--panel2); border:1px solid var(--line2); border-radius:12px; padding:12px 12px 12px 14px;
    margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; position:relative; transition:.12s; }
  .fcard:hover { border-color:#4a3f1f; }
  .fcard .ord { flex:0 0 auto; width:24px; height:24px; border-radius:7px; background:#2a2214; color:var(--gold);
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:3px; }
  .fcard .body { flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .fcard .line { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .fcard input, .fcard select { background:#15110a; }
  .fcard input.lbl { width:100%; font-weight:600; }
  .fcard input.small { flex:1; min-width:120px; }
  .fcard select { min-width:140px; }
  .fcard .del { background:#3a1414; color:#e58a84; border:1px solid #5a1f1f; padding:6px 9px; border-radius:8px; cursor:pointer;
    flex:0 0 auto; align-self:flex-start; font-size:13px; }
  .fcard .del:hover { background:#511c1c; }
  .field-cap { font-size:11px; color:var(--faint); }

  /* toggle switch */
  .switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-size:12.5px; color:var(--muted); }
  .switch input { display:none; }
  .switch .track { width:38px; height:21px; border-radius:999px; background:#2a2214; position:relative; transition:.18s; flex:0 0 auto; }
  .switch .track::after { content:""; position:absolute; top:2px; left:2px; width:17px; height:17px; border-radius:50%;
    background:#7a6a45; transition:.18s; }
  .switch input:checked + .track { background:linear-gradient(90deg,#c79a23,#e8c659); }
  .switch input:checked + .track::after { transform:translateX(17px); background:#1a1206; }

  .addbtn { background:transparent; border:1px dashed var(--line); color:var(--gold); width:100%; padding:11px;
    border-radius:11px; font-weight:600; }
  .addbtn:hover { border-color:var(--accent); background:#d4af3708; transform:none; }

  /* preview phone */
  .preview { background:#0c0a06; border:1px solid var(--line2); border-radius:16px; padding:14px; position:sticky; top:80px; align-self:start; }
  .preview-head { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin-bottom:12px;
    display:flex; align-items:center; gap:7px; }
  .preview-head .dot { width:7px; height:7px; border-radius:50%; background:#5fd185; box-shadow:0 0 8px #5fd185; }
  .chat { background:#0a0f0a; border-radius:12px; padding:12px; min-height:120px; max-height:380px; overflow:auto;
    display:flex; flex-direction:column; gap:8px; background-image:radial-gradient(#14201499 1px, transparent 1px); background-size:16px 16px; }
  .bubble { max-width:86%; padding:8px 11px; border-radius:12px; font-size:12.5px; line-height:1.45; }
  .bubble.bot { align-self:flex-start; background:#1d2a1d; color:#e7f3e0; border-bottom-left-radius:4px; }
  .bubble.sys { align-self:center; background:#2a2214; color:var(--gold); font-size:11px; padding:4px 10px; border-radius:999px; }
  .chat .pempty { color:var(--faint); font-size:12px; text-align:center; padding:24px 8px; }

  /* login gate */
  .gate { max-width:420px; margin:60px auto; text-align:center; background:linear-gradient(180deg,#16110a,#100c07);
    border:1px solid var(--line2); border-radius:18px; padding:36px 30px; box-shadow:var(--shadow); }
  .gate .big { font-size:40px; margin-bottom:10px; }
  .gate h3 { margin:0 0 8px; font-size:18px; }
  .gate p { color:var(--muted); font-size:13.5px; margin:0 0 6px; }
</style>
</head>
<body>
<header>
  <div class="app-title">Admissions</div>
  <div class="tabs">
    <div class="tab active" id="tab-applications" onclick="showView('applications')">📋 Candidatures</div>
    <div class="tab" id="tab-programs" onclick="showView('programs')">🎓 Programmes</div>
  </div>
  <div class="creds">
    <select id="uniPicker" onchange="pickUni()" title="Se connecter en tant qu'université">
      <option value="">— Se connecter en tant que… —</option>
    </select>
    <input id="apiKey" placeholder="X-API-Key (univ_…)" autocomplete="off" />
    <input id="apiSecret" type="password" placeholder="X-API-Secret (sk_…)" autocomplete="off" />
    <button onclick="connect()">Connexion</button>
  </div>
</header>

<main>
  <div id="errBox" class="err-box"></div>
  <div id="okBox" class="ok-box"></div>

  <!-- ===== Vue Candidatures ===== -->
  <div class="view active" id="view-applications">
    <div class="stats" id="stats"></div>
    <div class="bar">
      <div class="search-wrap"><span class="ico">🔍</span>
        <input id="search" placeholder="Rechercher (nom, téléphone, programme)…" oninput="render()" /></div>
      <span class="grow"></span>
      <span class="count" id="count"></span>
      <button class="ghost sm" onclick="loadList()">↻ Rafraîchir</button>
    </div>
    <div id="tableWrap"></div>
  </div>

  <!-- ===== Vue Programmes ===== -->
  <div class="view" id="view-programs">
    <div class="bar">
      <div class="search-wrap"><span class="ico">🔍</span>
        <input id="psearch" placeholder="Rechercher un programme…" oninput="renderPrograms()" /></div>
      <span class="grow"></span>
      <span class="count" id="pcount"></span>
      <button class="ghost sm" onclick="loadPrograms()">↻ Rafraîchir</button>
    </div>
    <div id="progWrap"></div>
  </div>
</main>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const DOC_TYPES = ["DIPLOME","RELEVE_NOTES","CARTE_IDENTITE","PHOTO","AUTRE"];
const DOC_LABELS = { DIPLOME:"🎓 Diplôme", RELEVE_NOTES:"📊 Relevé de notes", CARTE_IDENTITE:"🪪 Carte d'identité", PHOTO:"📷 Photo d'identité", AUTRE:"📄 Autre" };
const FIELD_TYPES = ["text","email","phone","number","date","select","textarea"];
const FIELD_LABELS = { text:"Texte", email:"Email", phone:"Téléphone", number:"Nombre", date:"Date", select:"Liste", textarea:"Texte long" };
const STATUS = {
  CHOOSING_UNIVERSITY:["En cours","b-collect"], CHOOSING_PROGRAM:["En cours","b-collect"],
  COLLECTING_FIELDS:["Saisie infos","b-collect"], COLLECTING_DOCUMENTS:["Collecte docs","b-collect"],
  VALIDATING:["Validation","b-pending"], VALIDATED:["Validé","b-valid"],
  PENDING_ENROLLMENT:["Attente inscription","b-pending"], SENT_TO_UNIVERSITY:["Envoyé","b-sent"],
  ACCEPTED:["Accepté","b-accept"], REJECTED:["Refusé","b-reject"],
};
const GROUPS = {
  all:{label:"Total",match:()=>true},
  progress:{label:"En cours",match:s=>["CHOOSING_UNIVERSITY","CHOOSING_PROGRAM","COLLECTING_FIELDS","COLLECTING_DOCUMENTS","VALIDATING","PENDING_ENROLLMENT","SENT_TO_UNIVERSITY"].includes(s)},
  validated:{label:"Validé",match:s=>s==="VALIDATED"},
  accepted:{label:"Accepté",match:s=>s==="ACCEPTED"},
  rejected:{label:"Refusé",match:s=>s==="REJECTED"},
};
let ALL=[], PROGS=[], activeGroup='all';

function creds(){ return { k:localStorage.getItem('dash_key')||'', s:localStorage.getItem('dash_secret')||'' }; }
function headers(){ const c=creds(); return { 'X-API-Key':c.k, 'X-API-Secret':c.s }; }
function showErr(m){ $('okBox').style.display='none'; const e=$('errBox'); e.textContent=m; e.style.display='block'; }
function showOk(m){ $('errBox').style.display='none'; const e=$('okBox'); e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',4000); }
function clearMsg(){ $('errBox').style.display='none'; $('okBox').style.display='none'; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(n){ if(!n) return '👤'; const p=n.trim().split(/\s+/); return ((p[0]||'')[0]||'').toUpperCase()+((p[1]||'')[0]||'').toUpperCase(); }

function connect(){ localStorage.setItem('dash_key',$('apiKey').value.trim()); localStorage.setItem('dash_secret',$('apiSecret').value.trim()); loadList(); loadPrograms(); }
function showView(v){ ['applications','programs'].forEach(x=>{ $('tab-'+x).classList.toggle('active',x===v); $('view-'+x).classList.toggle('active',x===v); }); clearMsg(); }

function badge(status,nodot){ const [l,c]=STATUS[status]||[status,'b-collect']; return `<span class="badge ${c} ${nodot?'nodot':''}">${l}</span>`; }
function fmtDate(s){ if(!s) return '—'; const d=new Date(s); return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function score(v){ return (v==null)?'—':Math.round(v*100)+'%'; }
function scoreBar(v){ if(v==null) return '<span class="muted">—</span>'; const p=Math.round(v*100);
  return `<div class="scorebar"><div class="track"><div class="fill" style="width:${p}%"></div></div><span class="pct">${p}%</span></div>`; }

async function api(path, opts={}){
  const res = await fetch(path,{ ...opts, headers:{ ...headers(), ...(opts.headers||{}) } });
  const body = await res.json().catch(()=>({}));
  if(!res.ok || body.success===false){ throw new Error(body?.error?.message || ('Erreur HTTP '+res.status)); }
  return body.data;
}
function gate(msg){ return `<div class="gate"><div class="big">🔐</div><h3>Connexion requise</h3>
  <p>${esc(msg||"Saisissez votre API Key et API Secret, ou choisissez une université dans le menu en haut.")}</p></div>`; }

/* ---------- Candidatures ---------- */
async function loadList(){
  clearMsg(); const c=creds();
  if(!c.k||!c.s){ $('stats').innerHTML=''; $('tableWrap').innerHTML=gate(); $('count').textContent=''; return; }
  try { const d=await api('/api/v1/applications'); ALL=d.items; renderStats(); render(); }
  catch(e){ ALL=[]; showErr(e.message); $('tableWrap').innerHTML=''; $('stats').innerHTML=''; }
}
function renderStats(){
  $('stats').innerHTML = Object.entries(GROUPS).map(([k,g])=>{
    const n=ALL.filter(a=>g.match(a.status)).length;
    return `<div class="chip s-${k} ${activeGroup===k?'active':''}" onclick="setGroup('${k}')"><div class="n">${n}</div><div class="l">${g.label}</div></div>`;
  }).join('');
}
function setGroup(k){ activeGroup=k; renderStats(); render(); }
function filtered(){
  const t=$('search').value.trim().toLowerCase(), g=GROUPS[activeGroup];
  return ALL.filter(a=>g.match(a.status) && (!t || (a.student_name||'').toLowerCase().includes(t) || (a.student_phone||'').toLowerCase().includes(t) || (a.program||'').toLowerCase().includes(t)));
}
function render(){
  const items=filtered(); $('count').textContent=`${items.length} / ${ALL.length} candidature(s)`;
  if(!items.length){ $('tableWrap').innerHTML='<div class="card"><div class="empty"><div class="big">🗂️</div>Aucune candidature ne correspond.</div></div>'; return; }
  const rows=items.map(a=>`<tr class="click" onclick="openDetail('${a.id}')">
    <td><div class="who"><div class="avatar">${esc(initials(a.student_name))}</div>
      <span class="nm">${esc(a.student_name)||'<span class=muted>—</span>'}</span></div></td>
    <td class="muted">${esc(a.student_phone)}</td><td>${esc(a.program)||'<span class=muted>—</span>'}</td>
    <td>${badge(a.status)}</td><td>${scoreBar(a.validation_score)}</td><td class="muted">${fmtDate(a.created_at)}</td></tr>`).join('');
  $('tableWrap').innerHTML=`<div class="card"><table><thead><tr><th>Étudiant</th><th>Téléphone</th><th>Programme</th><th>Statut</th><th>Score</th><th>Créée le</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function openDetail(id){
  clearMsg();
  try {
    const a=await api('/api/v1/applications/'+id);
    const decided=['ACCEPTED','REJECTED'].includes(a.status);
    const docs=(a.documents||[]).map(d=>{
      const ok=d.is_valid?'✅':'❌';
      const errs=(d.validation_errors||[]).length?`<div class="errs">${d.validation_errors.map(e=>'• '+esc(e)).join('<br>')}</div>`:'';
      return `<div class="doc"><div class="top">${ok} <b>${esc(DOC_LABELS[d.document_type]||d.document_type)}</b><span class="muted" style="margin-left:auto">${fmtDate(d.uploaded_at)}</span></div>${errs}</div>`;
    }).join('')||'<div class="muted">Aucun document.</div>';
    $('modal').className='modal';
    $('modal').innerHTML=`<div class="modal-head">
        <div class="avatar">${esc(initials(a.student_name))}</div>
        <h2>${esc(a.student_name)||'Candidature'}</h2>${badge(a.status)}<span class="x" onclick="closeModal()">×</span></div>
      <div class="modal-body">
        <div class="grid">
          <div><div class="k">Téléphone</div><div class="v">${esc(a.student_phone)||'—'}</div></div>
          <div><div class="k">Email</div><div class="v">${esc(a.student_email)||'—'}</div></div>
          <div><div class="k">Programme</div><div class="v">${esc(a.program)||'—'}</div></div>
          <div><div class="k">Score de validation</div><div class="v">${scoreBar(a.validation_score)}</div></div>
          <div><div class="k">Créée le</div><div class="v">${fmtDate(a.created_at)}</div></div>
          <div><div class="k">Décision le</div><div class="v">${fmtDate(a.decided_at)}</div></div>
        </div>
        ${a.ai_notes?`<div class="section-title">Analyse IA</div><div class="ai-notes">${esc(a.ai_notes)}</div>`:''}
        ${a.decision_comment?`<div class="section-title">Commentaire de décision</div><div class="v">${esc(a.decision_comment)}</div>`:''}
        <div class="section-title">Documents <span class="ct">${(a.documents||[]).length}</span></div>${docs}
        ${decided?'':`<div class="actions"><button class="green" onclick="decide('${a.id}','ACCEPTED')">✓ Accepter</button><button class="red" onclick="decide('${a.id}','REJECTED')">✗ Refuser</button></div>`}
      </div>`;
    $('overlay').classList.add('show');
  } catch(e){ showErr(e.message); }
}
async function decide(id,decision){
  const verb=decision==='ACCEPTED'?'accepter':'refuser';
  const comment=prompt(`Commentaire pour ${verb} :`, decision==='ACCEPTED'?'Félicitations, vous êtes admis(e) !':'');
  if(comment===null) return;
  try { await api('/api/v1/applications/'+id+'/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,comment})}); closeModal(); loadList(); showOk('Décision enregistrée.'); }
  catch(e){ showErr("Décision impossible : "+e.message); }
}
function closeModal(){ $('overlay').classList.remove('show'); }

/* ---------- Programmes / Formulaires ---------- */
async function loadPrograms(){
  clearMsg(); const c=creds();
  if(!c.k||!c.s){ $('progWrap').innerHTML=gate(); $('pcount').textContent=''; return; }
  try { PROGS=await api('/api/v1/admin/programs'); renderPrograms(); }
  catch(e){ PROGS=[]; showErr(e.message); $('progWrap').innerHTML=''; }
}
function renderPrograms(){
  const t=($('psearch').value||'').trim().toLowerCase();
  const items=PROGS.filter(p=>!t || (p.name||'').toLowerCase().includes(t) || (p.domain||'').toLowerCase().includes(t));
  $('pcount').textContent=`${items.length} / ${PROGS.length} programme(s)`;
  if(!items.length){ $('progWrap').innerHTML='<div class="card"><div class="empty"><div class="big">🎓</div>Aucun programme.</div></div>'; return; }
  const rows=items.map(p=>`<tr class="click" onclick="editForm('${p.id}','${esc(p.name).replace(/'/g,"&#39;")}')">
    <td><b>${esc(p.name)}</b></td><td class="muted">${esc(p.domain)||'—'}</td>
    <td>${p.is_active?'<span class="badge b-valid nodot">actif</span>':'<span class="badge b-draft nodot">inactif</span>'}</td>
    <td><span class="muted">⚙️ Configurer le formulaire →</span></td></tr>`).join('');
  $('progWrap').innerHTML=`<div class="card"><table><thead><tr><th>Programme</th><th>Domaine</th><th>État</th><th>Formulaire</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function fieldRow(f={}){
  const opts=FIELD_TYPES.map(t=>`<option value="${t}" ${f.field_type===t?'selected':''}>${FIELD_LABELS[t]}</option>`).join('');
  return `<div class="fcard">
    <div class="ord"></div>
    <div class="body">
      <input class="lbl f-label" placeholder="Question posée à l'étudiant (ex : Date de naissance)" value="${esc(f.label)}"/>
      <div class="line">
        <select class="f-type" title="Type de réponse">${opts}</select>
        <input class="small f-regex" placeholder="Format attendu — regex (optionnel)" value="${esc(f.validation_regex)}"/>
        <label class="switch"><input type="checkbox" class="f-req" ${f.is_required===false?'':'checked'}/><span class="track"></span>Requis</label>
      </div>
    </div>
    <button class="del" title="Supprimer" onclick="removeRow(this)">🗑</button>
  </div>`;
}
function docRow(d={}){
  const opts=DOC_TYPES.map(t=>`<option value="${t}" ${d.document_type===t?'selected':''}>${DOC_LABELS[t]}</option>`).join('');
  return `<div class="fcard">
    <div class="ord"></div>
    <div class="body">
      <div class="line">
        <select class="d-type" title="Type de document">${opts}</select>
        <input class="small d-label" placeholder="Libellé montré à l'étudiant (ex : Votre diplôme)" value="${esc(d.label)}"/>
        <label class="switch"><input type="checkbox" class="d-req" ${d.is_required===false?'':'checked'}/><span class="track"></span>Requis</label>
      </div>
    </div>
    <button class="del" title="Supprimer" onclick="removeRow(this)">🗑</button>
  </div>`;
}
function renumber(){
  document.querySelectorAll('#fields .fcard .ord').forEach((o,i)=>o.textContent=i+1);
  document.querySelectorAll('#docs .fcard .ord').forEach((o,i)=>o.textContent=i+1);
}
function addField(){ $('fields').insertAdjacentHTML('beforeend', fieldRow()); renumber(); renderFormPreview(); }
function addDoc(){ $('docs').insertAdjacentHTML('beforeend', docRow()); renumber(); renderFormPreview(); }
function removeRow(btn){ btn.closest('.fcard').remove(); renumber(); renderFormPreview(); }

async function editForm(programId, name){
  clearMsg();
  let form={fields:[],required_documents:[],is_published:false};
  try { form=await api('/api/v1/admin/forms/'+programId); }
  catch(e){ /* 404 = pas encore de formulaire → brouillon vide */ }
  const pub = form.is_published;
  const fieldsHtml=(form.fields||[]).slice().sort((a,b)=>a.order-b.order).map(fieldRow).join('');
  const docsHtml=(form.required_documents||[]).slice().sort((a,b)=>a.order-b.order).map(docRow).join('');
  $('modal').className='modal wide';
  $('modal').innerHTML=`<div class="modal-head"><h2>⚙️ ${esc(name)}</h2>
      <span class="badge ${pub?'b-pub':'b-draft'} nodot">${pub?'publié':'brouillon'}</span>
      <span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <div class="form-layout">
        <div>
          <div class="section-title">📝 Informations à demander<span class="grow"></span></div>
          <div class="hint">Questions posées une par une à l'étudiant sur WhatsApp, dans l'ordre.</div>
          <div id="fields" oninput="renderFormPreview()" onchange="renderFormPreview()">${fieldsHtml}</div>
          <button class="addbtn" onclick="addField()">＋ Ajouter une information</button>

          <div class="section-title" style="margin-top:24px">📎 Documents à fournir<span class="grow"></span></div>
          <div class="hint">Pièces que l'étudiant devra envoyer (analysées par l'IA).</div>
          <div id="docs" oninput="renderFormPreview()" onchange="renderFormPreview()">${docsHtml}</div>
          <button class="addbtn" onclick="addDoc()">＋ Ajouter un document</button>
        </div>

        <div class="preview">
          <div class="preview-head"><span class="dot"></span> Aperçu — côté étudiant</div>
          <div class="chat" id="formPreview"></div>
        </div>
      </div>

      <div class="actions">
        <button class="green" onclick="saveForm('${programId}', ${pub})">💾 Enregistrer & publier</button>
        <button class="ghost" onclick="closeModal()">Annuler</button>
        <span class="muted" style="font-size:12px">Ces champs et documents seront demandés par le bot pour ce programme.</span>
      </div>
    </div>`;
  $('overlay').classList.add('show');
  renumber(); renderFormPreview();
}

function renderFormPreview(){
  const {fields, required_documents}=collectForm();
  let html='';
  if(!fields.length && !required_documents.length){
    $('formPreview').innerHTML='<div class="pempty">Ajoutez des informations ou des documents pour visualiser ce que verra l\'étudiant. 👇</div>';
    return;
  }
  html+='<div class="bubble bot">👋 Bienvenue ! Constituons votre dossier.</div>';
  if(fields.length){
    html+='<div class="bubble sys">Informations</div>';
    fields.forEach(f=>{ html+=`<div class="bubble bot">📝 ${esc(f.label)}${f.is_required?'':' <i style="opacity:.6">(facultatif)</i>'}</div>`; });
  }
  if(required_documents.length){
    html+='<div class="bubble sys">Documents</div>';
    required_documents.forEach(d=>{ html+=`<div class="bubble bot">📎 Envoyez : <b>${esc(d.label||DOC_LABELS[d.document_type])}</b>${d.is_required?'':' <i style="opacity:.6">(facultatif)</i>'}</div>`; });
  }
  html+='<div class="bubble bot">✅ Merci ! Votre dossier est en cours de validation.</div>';
  $('formPreview').innerHTML=html;
}

function collectForm(){
  const fields=[...document.querySelectorAll('#fields .fcard')].map((r,i)=>({
    label:r.querySelector('.f-label').value.trim(),
    field_type:r.querySelector('.f-type').value,
    validation_regex:r.querySelector('.f-regex').value.trim()||null,
    is_required:r.querySelector('.f-req').checked, order:i,
  })).filter(f=>f.label);
  const required_documents=[...document.querySelectorAll('#docs .fcard')].map((r,i)=>({
    document_type:r.querySelector('.d-type').value,
    label:r.querySelector('.d-label').value.trim()||r.querySelector('.d-type').value,
    is_required:r.querySelector('.d-req').checked, order:i,
  }));
  return {fields, required_documents};
}
async function saveForm(programId, wasPublished){
  clearMsg();
  const payload=collectForm();
  try {
    if(wasPublished){ await api('/api/v1/admin/forms/'+programId+'/unpublish',{method:'POST'}); }
    await api('/api/v1/admin/forms/'+programId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    await api('/api/v1/admin/forms/'+programId+'/publish',{method:'POST'});
    closeModal(); showOk('Formulaire enregistré et publié ✅ — le bot demandera ces champs/documents.');
  } catch(e){ showErr("Échec : "+e.message); }
}

/* ---------- Connexion rapide « en tant qu'université » (dev/démo) ---------- */
let CREDS_LIST=[];
async function loadUniPicker(){
  try {
    const res=await fetch('/dev/credentials'); if(!res.ok) return;
    CREDS_LIST=await res.json();
    if(!Array.isArray(CREDS_LIST)||!CREDS_LIST.length) return;
    $('uniPicker').innerHTML='<option value="">— Se connecter en tant que… —</option>'+
      CREDS_LIST.map((u,i)=>`<option value="${i}">${esc(u.name)}</option>`).join('');
  } catch(e){ /* endpoint absent (prod) → on garde la saisie manuelle */ }
}
function pickUni(){
  const i=$('uniPicker').value; if(i==='') return;
  const u=CREDS_LIST[i]; if(!u) return;
  $('apiKey').value=u.api_key; $('apiSecret').value=u.api_secret;
  connect();
}

/* init */
(function(){ const c=creds(); $('apiKey').value=c.k; $('apiSecret').value=c.s; loadUniPicker();
  if(c.k&&c.s){ loadList(); loadPrograms(); } else { $('tableWrap').innerHTML=gate(); } })();
</script>
