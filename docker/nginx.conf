# ============================================================
# Nginx — reverse proxy devant l'API FastAPI en production
# TLS terminé en amont (cert-manager / Let's Encrypt)
# ============================================================
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 15M;    # upload documents

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct=$upstream_connect_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain application/json application/xml;
    gzip_min_length 1024;

    # Rate limiting par IP (en complément du rate-limit applicatif)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;

    upstream admission_api {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Redirige tout HTTP vers HTTPS (en prod réelle, géré par LB)
        # location / { return 301 https://$host$request_uri; }

        location /health {
            access_log off;
            proxy_pass http://admission_api/health;
        }

        location / {
            limit_req zone=api_limit burst=120 nodelay;

            proxy_pass         http://admission_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
