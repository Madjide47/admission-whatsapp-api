name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # conftest.py fournit toutes les variables d'env (SQLite mémoire,
        # mocks Twilio/IA/GCS) — aucun secret requis.
        # test_ocr.py est déjà exclu via addopts (pas de binaire Tesseract en CI).
        run: pytest
